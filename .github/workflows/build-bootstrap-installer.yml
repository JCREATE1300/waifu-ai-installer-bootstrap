name: Build Bootstrap Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Cancel outdated runs on the same branch/PR, but never cancel a tagged release build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; the release job elevates only what it needs
permissions:
  contents: read

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci = clean, reproducible install from package-lock.json (faster and stricter than npm install)
      - name: Install dependencies
        run: npm ci

      # On a tag like v1.2.3, stamp 1.2.3 into package.json so the installer is versioned correctly
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          npm version $v --no-git-tag-version --allow-same-version

      # These only run if the scripts exist in package.json
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build bootstrap app
        run: npm run build

      - name: Package bootstrap installer
        env:
          # Optional code signing: add these as repo secrets to sign the installer.
          # If they're empty, the build is simply unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: waifu-ai-installer-bootstrap
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release
      id-token: write       # sign build provenance
      attestations: write   # store build provenance

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: waifu-ai-installer-bootstrap
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
