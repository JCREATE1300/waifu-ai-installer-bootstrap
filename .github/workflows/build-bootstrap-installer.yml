name: Build Bootstrap Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build bootstrap app
        run: npm run build

      - name: Package bootstrap installer
        run: npm run dist

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: waifu-ai-installer-bootstrap
          path: dist/*.exe
          if-no-files-found: error
