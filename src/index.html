<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waifu AI Bootstrap</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(15, 23, 42, 0.9);
        --muted: #94a3b8;
        --primary: #8b5cf6;
        --text: #e2e8f0;
        --good: #22c55e;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .panel {
        width: 560px;
        min-height: 320px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 22px;
        padding: 26px 28px 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .badge {
        display: inline-block;
        background: rgba(139, 92, 246, 0.15);
        border: 1px solid rgba(139, 92, 246, 0.5);
        color: #c4b5fd;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 3rem;
        line-height: 1.05;
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 1.15rem;
        line-height: 1.5;
      }

      .status {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 16px;
        min-height: 100px;
        padding: 14px 16px;
        color: #dbeafe;
        white-space: pre-wrap;
      }

      .footer {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        display: inline-block;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="badge">Installer</div>
      <h1>Waifu AI Update</h1>
      <p class="subtitle">Checking for the newest desktop build, downloading the installer, and launching it.</p>

      <div id="status" class="status">Preparing…</div>

      <div class="footer">
        <span><span class="dot"></span>Secure bootstrap</span>
        <span>Latest release workflow</span>
      </div>
    </div>

    <script type="module">
      const { invoke } = window.__TAURI__.core;
      const statusEl = document.getElementById("status");

      const downloadUrl = "PASTE_YOUR_DIRECT_DOWNLOAD_URL_HERE";

      statusEl.textContent = "Downloading installer...";

      invoke("download_and_run", { url: downloadUrl })
        .then((result) => {
          statusEl.textContent = result;
        })
        .catch((error) => {
          statusEl.textContent = error;
        });
    </script>
  </body>
</html>
